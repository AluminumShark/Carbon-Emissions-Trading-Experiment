[project]
name = "carbon-emissions-trading-experiment"
version = "0.1.0"
description = "Carbon Emissions Trading Experiment Platform using oTree"
requires-python = ">=3.11"
dependencies = [
    "otree>=5.10.0",
    "PyYAML>=6.0",
    "psycopg2-binary>=2.9.0",
    "sentry-sdk>=1.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F403",   # `from xxx import *` used (common in oTree)
    "F405",   # name may be undefined from star imports (common in oTree)
    "E402",   # module import not at top of file (oTree settings pattern)
]

[tool.ruff.lint.per-file-ignores]
"Stage_*/__init__.py" = ["F401"]  # Allow unused imports in oTree app modules
"settings.py" = ["F401"]          # Allow unused imports in settings

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
